name: Vibely
description: >-
  Vibely was a creator-community platform (surfaced as a 500 Global portfolio company) that let creators
  host paid communities, challenges, and group chat. As of this enrichment pass the domain vibely.io no
  longer serves an independent product; every path — including all /.well-known/ discovery endpoints —
  301-redirects to kajabi.com/features/communities, indicating Vibely was folded into Kajabi's Communities
  product. No standalone Vibely developer portal, API, OpenAPI, SDK, MCP server, or llms.txt could be
  found; the only artifact captured is a probed TLS/DNS domain-security profile of the surviving redirect
  domain. This profile is retained as a defunct/acquired portfolio lead.
